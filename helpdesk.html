<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CWA Help Desk Appointment</title>
</head>
<body>
    <header>
        <a href="https://www.swinburne.edu.au/"><img src="C:\Users\Admin\Downloads\lab03-1\logo.png"></a>
        <h1>CWA Help Desk Appointment</h1>
    </header>
    <p>The Help Desk is located in ATC620 Open 10:30 to 19:00 Monday To Friday</p>
    <p>Check Blackboard for when CWA tutors will be there</p>
    <form action="submit.php" method="post">
    <fieldset>
        <legend>User Information</legend>
	        <p><label for="StudentId">Student ID</label> 
		        <input type="text" name="Studentid" id="StudentId" required="required" maxlength="8" pattern="[A-Za-z]+" placeholder="e.g., SWH00000">
                <br>
            </p>
            <p><label for="Gname">Given Name:</label>
                <input type="Gname" id="Gname" name="Gname" required="required" maxlength="15" pattern="[A-Za-z]+" placeholder="e.g., John">
                <br>
            </p>
            <p><label for="Fname">Family Name:</label>
                <input type="Fname" id="Fname" name="Fname" required="required" maxlength="15" pattern="[A-Za-z]+" placeholder="e.g., Doe">
            </p>
    </fieldset>
<fieldset>
  <legend>Your Unit</legend>
  <p>Select at least one option:</p>
  <p>
    <input type="radio" name="Unit" id="COS10011" value="COS10011" required>   
    <label for="COS10011">COS10011</label>
    
    <input type="radio" name="Unit" id="COS60004" value="COS60004">   
    <label for="COS60004">COS60004</label>
    
    <input type="radio" name="Unit" id="COS60007" value="COS60007">   
    <label for="COS60007">COS60007</label>
  </p>
  <p>
    <label for= "Your_Tutor">Your Tutor</label>
    <select name="Your_Tutor" id="Tutor"
    <option value ="Please_Select">Please Select</option>
        <option value="Please_Select">Please Select</option>
    </select>
  </p>
</fieldset>
<fieldset>
    <legend>Issue</legend>
    <p>
    <label for="html">HTML</label>
    <input type="checkbox" id="html" name="issue[]" value="html" checked="checked">

    <label for="css">CSS</label>
    <input type="checkbox" id="css" name="issue[]" value="css">

    <label for="js">JavaScript</label>
    <input type="checkbox" id="js" name="issue[]" value="js">

    <label for="php">PHP</label>
    <input type="checkbox" id="php" name="issue[]" value="php">

    <label for="mysql">MySQL</label>
    <input type="checkbox" id="mysql" name="issue[]" value="mysql">
  </p>

  <p>
    <label for="description">Description of Issue</label><br>
    <textarea id="description" name="description" rows="4" cols="30" placeholder="Write description of your problem here..."></textarea>
  </p>
</fieldset>
    <fieldset>
  <legend>Preferred Date / Time</legend>

  <p>
    <label for="date">Date</label>
    <input type="text" id="date" name="date" required="required" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}">
  </p>

  <p>
    <label for="time">Time</label>
    <input type="text" id="time" name="time" required="required" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]">
  </p>
</fieldset>

<p>
  <input type="submit" value="Book">
  <input type="reset" value="Reset form">
</p>
